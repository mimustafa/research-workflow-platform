apiVersion: v1
kind: Service
metadata:
  name: {{ include "research-workflow.fullname" . }}-api
  labels:
    {{- include "research-workflow.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research-workflow.fullname" . }}-api
  labels:
    {{- include "research-workflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "research-workflow.fullname" . }}-postgres:5432/$(POSTGRES_DB)"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@{{ include "research-workflow.fullname" . }}-rabbitmq:5672/"
          envFrom:
            - secretRef:
                name: {{ include "research-workflow.fullname" . }}-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
