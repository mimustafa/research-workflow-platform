apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research-workflow.fullname" . }}-worker
  labels:
    {{- include "research-workflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: {{ .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "research-workflow.fullname" . }}-postgres:5432/$(POSTGRES_DB)"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@{{ include "research-workflow.fullname" . }}-rabbitmq:5672/"
          envFrom:
            - secretRef:
                name: {{ include "research-workflow.fullname" . }}-credentials
