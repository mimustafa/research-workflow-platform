{{- if .Values.openbao.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "research-workflow.fullname" . }}-openbao
  labels:
    {{- include "research-workflow.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.openbao.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/component: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research-workflow.fullname" . }}-openbao
  labels:
    {{- include "research-workflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: openbao
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.images.openbao | quote }}
          args: ["server", "-dev", "-dev-root-token-id={{ .Values.openbao.rootToken }}"]
          env:
            - name: BAO_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          ports:
            - name: http
              containerPort: 8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
{{- end }}
