---
- name: Deploy the Research Workflow Platform
  hosts: portfolio_hosts
  become: true
  vars:
    docker_apt_architecture: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  pre_tasks:
    - name: Require Ubuntu hosts
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: This playbook currently supports Ubuntu only.

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Clone the application repository
      ansible.builtin.git:
        repo: "{{ project_repository }}"
        dest: "{{ project_directory }}"
        version: "{{ project_version }}"
        force: true

    - name: Create Docker Compose environment file
      ansible.builtin.copy:
        dest: "{{ project_directory }}/.env"
        mode: "0600"
        content: |
          POSTGRES_DB={{ postgres_db }}
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password }}
          RABBITMQ_USER={{ rabbitmq_user }}
          RABBITMQ_PASSWORD={{ rabbitmq_password }}

    - name: Build and start the platform
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: "{{ project_directory }}"
      changed_when: true
