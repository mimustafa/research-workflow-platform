services:
  openbao:
    image: openbao/openbao:2.1.1
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev", "-dev-root-token-id=local-root-token"]
    environment:
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
      BAO_TOKEN: local-root-token
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
